<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Cormorant Garamond";
      src: url("./fonts/CormorantGaramond-wght.ttf") format("truetype");
      font-weight: 300 700;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "Cormorant Garamond";
      src: url("./fonts/CormorantGaramond-Italic-wght.ttf") format("truetype");
      font-weight: 300 700;
      font-style: italic;
      font-display: block;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #FFF9F5;
      color: #6D424B;
    }
    body {
      position: relative;
      font-family: "Cormorant Garamond", "Liberation Serif", serif;
    }
    .wash {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 52% 46% at 50% 78%, rgba(245, 221, 225, 0.95) 0%, rgba(245, 221, 225, 0.35) 46%, rgba(255, 249, 245, 0) 72%),
        radial-gradient(ellipse 28% 22% at 50% 72%, rgba(201, 154, 131, 0.18) 0%, rgba(255, 249, 245, 0) 70%),
        #FFF9F5;
    }
    .grain {
      position: absolute;
      inset: 0;
      width: 1200px;
      height: 630px;
      opacity: 0.07;
      mix-blend-mode: multiply;
      pointer-events: none;
    }
    .rule {
      position: absolute;
      inset: 28px;
      border: 1px solid rgba(109, 66, 75, 0.28);
      pointer-events: none;
    }
    .rule::after {
      content: "";
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(109, 66, 75, 0.12);
    }
    main {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 80px 52px;
    }
    h1 {
      font-weight: 500;
      font-size: 118px;
      line-height: 0.9;
      letter-spacing: -0.025em;
      color: #6D424B;
      font-style: normal;
    }
    .by {
      margin-top: 10px;
      font-weight: 400;
      font-style: italic;
      font-size: 34px;
      letter-spacing: 0.22em;
      color: #8A5962;
      padding-left: 0.22em;
    }
    .nails {
      margin-top: 22px;
      width: 620px;
      height: 196px;
    }
  </style>
</head>
<body>
  <div class="wash"></div>
  <svg class="grain" aria-hidden="true">
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#grain)"/>
  </svg>
  <div class="rule"></div>
  <main>
    <h1>Glam Nails</h1>
    <p class="by">by Yukti</p>
    <svg class="nails" viewBox="0 0 620 196" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="body" x1="0.2" y1="0" x2="0.75" y2="1">
          <stop offset="0%" stop-color="#FFF9F5"/>
          <stop offset="16%" stop-color="#F7E4E6"/>
          <stop offset="48%" stop-color="#F5DDE1"/>
          <stop offset="100%" stop-color="#E7C4CA"/>
        </linearGradient>
        <linearGradient id="bodyWarm" x1="0.15" y1="0" x2="0.85" y2="1">
          <stop offset="0%" stop-color="#FFF7F3"/>
          <stop offset="42%" stop-color="#F4D6D1"/>
          <stop offset="100%" stop-color="#DDB5AB"/>
        </linearGradient>
        <linearGradient id="french" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#C99A83"/>
          <stop offset="18%" stop-color="#D7B09C"/>
          <stop offset="34%" stop-color="#C99A83" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="shine" cx="32%" cy="26%" r="46%">
          <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92"/>
          <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.2"/>
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
          <stop offset="78%" stop-color="#FFFFFF" stop-opacity="0"/>
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.5"/>
        </linearGradient>
        <filter id="shadow" x="-25%" y="-15%" width="150%" height="150%">
          <feDropShadow dx="0" dy="8" stdDeviation="5.5" flood-color="#6D424B" flood-opacity="0.2"/>
        </filter>
      </defs>
      <g filter="url(#shadow)">
        <g transform="translate(6 22) rotate(-8 46 86)">
          <path d="M46 4C64 24 78 54 80 86C82 114 74 140 58 154C52 160 40 160 34 154C18 140 10 114 12 86C14 54 28 24 46 4Z" fill="url(#body)"/>
          <path d="M46 4C64 24 78 54 80 86C82 114 74 140 58 154C52 160 40 160 34 154C18 140 10 114 12 86C14 54 28 24 46 4Z" fill="url(#shine)"/>
          <path d="M46 4C64 24 78 54 80 86C82 114 74 140 58 154C52 160 40 160 34 154C18 140 10 114 12 86C14 54 28 24 46 4Z" fill="url(#edge)"/>
          <path d="M22 132C30 146 62 146 70 132" fill="none" stroke="#C99A83" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>
          <path d="M30 42C32 70 34 98 38 122" fill="none" stroke="#FFFFFF" stroke-opacity="0.72" stroke-width="2.5" stroke-linecap="round"/>
        </g>
        <g transform="translate(162 10) rotate(-3 46 86)">
          <path d="M46 4C64 24 78 54 80 86C82 114 74 140 58 154C52 160 40 160 34 154C18 140 10 114 12 86C14 54 28 24 46 4Z" fill="url(#body)"/>
          <path d="M46 4C64 24 78 54 80 86C82 114 74 140 58 154C52 160 40 160 34 154C18 140 10 114 12 86C14 54 28 24 46 4Z" fill="url(#french)"/>
          <path d="M46 4C64 24 78 54 80 86C82 114 74 140 58 154C52 160 40 160 34 154C18 140 10 114 12 86C14 54 28 24 46 4Z" fill="url(#shine)"/>
          <path d="M46 4C64 24 78 54 80 86C82 114 74 140 58 154C52 160 40 160 34 154C18 140 10 114 12 86C14 54 28 24 46 4Z" fill="url(#edge)"/>
          <path d="M22 132C30 146 62 146 70 132" fill="none" stroke="#C99A83" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round"/>
          <path d="M28 46C31 74 33 100 37 124" fill="none" stroke="#FFFFFF" stroke-opacity="0.78" stroke-width="2.6" stroke-linecap="round"/>
        </g>
        <g transform="translate(318 10) rotate(3 46 86)">
          <path d="M46 4C64 24 78 54 80 86C82 114 74 140 58 154C52 160 40 160 34 154C18 140 10 114 12 86C14 54 28 24 46 4Z" fill="url(#bodyWarm)"/>
          <path d="M46 4C64 24 78 54 80 86C82 114 74 140 58 154C52 160 40 160 34 154C18 140 10 114 12 86C14 54 28 24 46 4Z" fill="url(#shine)"/>
          <path d="M46 4C64 24 78 54 80 86C82 114 74 140 58 154C52 160 40 160 34 154C18 140 10 114 12 86C14 54 28 24 46 4Z" fill="url(#edge)"/>
          <path d="M22 132C30 146 62 146 70 132" fill="none" stroke="#C99A83" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round"/>
          <path d="M30 48C32 74 35 98 39 120" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="2.4" stroke-linecap="round"/>
        </g>
        <g transform="translate(474 22) rotate(8 46 86)">
          <path d="M46 4C64 24 78 54 80 86C82 114 74 140 58 154C52 160 40 160 34 154C18 140 10 114 12 86C14 54 28 24 46 4Z" fill="url(#body)"/>
          <path d="M46 4C64 24 78 54 80 86C82 114 74 140 58 154C52 160 40 160 34 154C18 140 10 114 12 86C14 54 28 24 46 4Z" fill="url(#shine)"/>
          <path d="M46 4C64 24 78 54 80 86C82 114 74 140 58 154C52 160 40 160 34 154C18 140 10 114 12 86C14 54 28 24 46 4Z" fill="url(#edge)"/>
          <path d="M22 132C30 146 62 146 70 132" fill="none" stroke="#C99A83" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>
          <path d="M32 40C34 66 36 92 40 116" fill="none" stroke="#FFFFFF" stroke-opacity="0.72" stroke-width="2.5" stroke-linecap="round"/>
        </g>
      </g>
    </svg>
  </main>
</body>
</html>
